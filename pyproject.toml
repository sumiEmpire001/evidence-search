[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lord-sumi-evidence-search"
version = "0.1.0"
description = "Local source retrieval with revision-bound citations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
evidence-search = "evidence_search.__main__:main"

[tool.setuptools.packages.find]
include = ["evidence_search*"]
